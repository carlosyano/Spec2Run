.step b{display:block}.step span{font-size:14px;color:var(--mut)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.panel{display:none}.panel.on{display:block}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.tw{overflow-x:auto}
select{font:inherit;font-size:14px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}

dl{margin:0}dt{font-weight:700;margin-top:12px}dd{margin:2px 0 0;color:var(--mut);font-size:15px}
ul.refs{padding-left:20px;color:var(--mut)}ul.refs li{margin:8px 0}
footer{padding:36px 0;border-top:1px solid var(--line);color:var(--mut);font-size:14px}

let L="en",simSel=[0,1,2,3],tam=false;const $=id=>document.getElementById(id);
const humanAt={3:"hg1",6:"hg2",9:"hg3",10:"hg4"};
function render(){const t=T[L];
document.documentElement.lang=L==="pt"?"pt-BR":"en";document.title="Spec2Run AI · "+t.slogan;
document.querySelectorAll("[data-i]").forEach(e=>{const v=t[e.dataset.i];if(v==null)return;e.hasAttribute("data-html")?e.innerHTML=v:e.textContent=v});
$("lang").textContent=L==="en"?"PT":"EN";
const hg={en:["Person approves spec and design","Person approves the tests","Person approves code, then deployment"],pt:["Pessoa aprova spec e desenho","Pessoa aprova os testes","Pessoa aprova o código e, depois, a implantação"]}[L];
const hmap={3:0,6:1,10:2};
$("flow").innerHTML=t.lc.map((r,i)=>`<div class="step"><b>${r[0]}</b><span>${r[1]}</span><u>${r[2]}</u>${i in hmap?`<em class="hg">${hg[hmap[i]]}</em>`:""}</div>`).join("");
const rc=t.rt.slice().sort((a,b)=>["Specifier","Architect","Test designer","Builder","Reviewer"].indexOf(a[0])-["Specifier","Architect","Test designer","Builder","Reviewer"].indexOf(b[0]));
$("rolecards").innerHTML=rc.map(r=>`<div class="card"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("");
$("tabs").innerHTML=t.tabs.map((x,i)=>`<button data-t="${i}" class="${i===tab?'on':''}">${x}</button>`).join("");
document.querySelectorAll(".panel").forEach((p,i)=>p.classList.toggle("on",i===tab));
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=+b.dataset.t;render()});
$("lchead").innerHTML=t.lchead.map(x=>`<th>${x}</th>`).join("");
$("lcbody").innerHTML=t.lc.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
$("cmdbody").innerHTML=t.cmd.map(r=>`<tr><td><code>/s2r ${r[0]}</code></td><td>${r[1]}</td></tr>`).join("");
$("rthead").innerHTML=t.rthead.map(x=>`<th>${x}</th>`).join("");
$("rtbody").innerHTML=t.rt.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("");
$("sim").innerHTML=t.simroles.map((r,i)=>`<div><label>${r}</label><select data-s="${i}">${t.simprov.map((p,j)=>`<option value="${j}" ${simSel[i]===j?"selected":""}>${p}</option>`).join("")}</select></div>`).join("");
document.querySelectorAll("#sim select").forEach(s=>s.onchange=()=>{simSel[+s.dataset.s]=+s.value;simCheck()});simCheck();
$("lane").innerHTML=t.lane.map(r=>`<div class="card"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("");
$("tamper").textContent=t.tamper;$("restore").textContent=t.restore;$("tamper").onclick=()=>{tam=true;chain()};$("restore").onclick=()=>{tam=false;chain()};chain();
$("safe").innerHTML=t.safe.map(r=>`<div class="card"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("");
$("sens").innerHTML=t.sens.map(r=>`<div class="card"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("");
$("gloss").innerHTML=t.gloss.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("");}
let tab=0;
function simCheck(){const [sp,td,bu,rv]=simSel,t=T[L],r=$("simres");
if(rv===sp||rv===bu){r.className="res bad";r.textContent=t.sim_bad}else if(td===bu){r.className="res adv";r.textContent=t.sim_adv}else{r.className="res ok";r.textContent=t.sim_ok}}
function chain(){const t=T[L];$("chain").innerHTML=t.blk.map((b,i)=>`<div class="blk ${tam&&i>=1?"bad":""}"><b>${b}</b><br>${tam&&i>=1?"hash ≠":"hash ✓"}</div>`).join("");
const r=$("chres");r.className="res "+(tam?"bad":"ok");r.textContent=tam?t.chbad:t.chok}
$("lang").onclick=()=>{L=L==="en"?"pt":"en";render()};
$("theme").onclick=()=>{const r=document.documentElement;const d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script>
